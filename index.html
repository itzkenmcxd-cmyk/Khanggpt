
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KhangGPT</title>
<style>
body{margin:0;background:#111318;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#191c23;border-bottom:1px solid #333;font-size:21px;font-weight:bold}
#chat{height:65vh;overflow:auto;padding:15px}
.msg{padding:12px;margin:10px 0;border-radius:12px;background:#222631;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#343047}
img{max-width:180px;border-radius:10px;display:block;margin:8px 0}
footer{position:fixed;bottom:0;left:0;right:0;background:#191c23;padding:12px}
textarea{width:100%;box-sizing:border-box;background:#222631;color:white;border:0;border-radius:10px;padding:12px;resize:vertical}
button,.pick{background:#7568dc;color:white;border:0;border-radius:9px;padding:10px;margin:4px}
#files{font-size:12px;color:#aaa}
</style>
</head>
<body>
<header>✨ KhangGPT</header>
<div id="chat"></div>
<footer>
<div id="files"></div>
<textarea id="prompt" placeholder="Nhắn tin cho KhangGPT..."></textarea>
<label class="pick">🖼️ Ảnh<input id="images" type="file" accept="image/*" multiple hidden></label>
<label class="pick">📷 Chụp<input id="camera" type="file" accept="image/*" capture="environment" hidden></label>
<label class="pick">📎 Tệp<input id="docs" type="file" accept=".txt,.md,.csv,.json,.pdf" multiple hidden></label>
<button onclick="voice()">🎙️ Nói</button>
<button onclick="send()">Gửi ➤</button>
</footer>
<script>
const API="https://khanggpt.itzkenmcxd.workers.dev";
let history=[],attachments=[];
const chat=document.getElementById("chat");
function add(role,text,files=[]){
 const d=document.createElement("div");
 d.className="msg "+(role==="user"?"user":"");
 d.textContent=(role==="user"?"Bạn: ":"KhangGPT: ")+text;
 files.forEach(f=>{
  if(f.type.startsWith("image/")){
   const im=document.createElement("img");
   im.src=URL.createObjectURL(f);d.appendChild(im);
  }else{
   const p=document.createElement("p");p.textContent="📎 "+f.name;d.appendChild(p);
  }
 });
 chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
function selectFiles(input){
 input.onchange=()=>{
  attachments.push(...input.files);
  document.getElementById("files").textContent=
   attachments.map(f=>"📎 "+f.name).join(" | ");
 };
}
selectFiles(document.getElementById("images"));
selectFiles(document.getElementById("camera"));
selectFiles(document.getElementById("docs"));
async function send(){
 const text=document.getElementById("prompt").value.trim();
 if(!text&&!attachments.length)return;
 const files=attachments.slice();attachments=[];
 document.getElementById("files").textContent="";
 document.getElementById("prompt").value="";
 add("user",text,files);
 let content=[];
 if(text)content.push({type:"text",text});
 for(const f of files){
  if(f.type.startsWith("image/")){
   const data=await new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f);
   });
   content.push({type:"image_url",image_url:{url:data}});
  }else if(/\.(txt|md|csv|json)$/i.test(f.name)){
   content.push({type:"text",text:"Tệp "+f.name+":\n"+await f.text()});
  }else{
   content.push({type:"text",text:"Đã đính kèm "+f.name+". Máy chủ cần hỗ trợ đọc PDF."});
  }
 }
 history.push({role:"user",content:content.length===1&&content[0].type==="text"?text:content});
 const waiting=add("assistant","Đang suy nghĩ...");
 try{
  const response=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages:history})
  });
  if(!response.ok)throw new Error("Lỗi máy chủ "+response.status);
  const data=await response.json();
  const answer=data.reply||data.choices?.[0]?.message?.content||"AI chưa trả lời.";
  waiting.textContent="KhangGPT: "+answer;
  history.push({role:"assistant",content:answer});
 }catch(e){waiting.textContent="Lỗi kết nối: "+e.message;}
}
function voice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("Hãy thử dùng Chrome để nhập giọng nói.");return;}
 const r=new SR();r.lang="vi-VN";
 r.onresult=e=>document.getElementById("prompt").value+=e.results[0][0].transcript;
 r.start();
}
</script>
</body>
</html>
