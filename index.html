

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b18">
<title>KhangGPT Ultra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#090b18;--panel:#11172b;--panel2:#19213a;--line:#ffffff16;--text:#f4f5ff;--muted:#9ba6c3;--purple:#9565ff;--blue:#478cff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 15% 0%,#29204d,transparent 40%),radial-gradient(ellipse at 100% 30%,#102e50,transparent 35%),var(--bg);color:var(--text);font:15px/1.6 system-ui,Arial;height:100dvh;overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:260px 1fr;gap:13px;padding:13px;max-width:1600px;margin:auto}
.sidebar,.main{background:#11172beF;border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(18px);min-height:0;box-shadow:0 15px 55px #0005}
.sidebar{padding:17px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:850}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#a66cff,#438bff);display:grid;place-items:center;font-size:23px}
.tag{font-size:9px;color:#d2bfff;border:1px solid #9565ff66;border-radius:20px;padding:3px 7px}
.new{padding:12px;border:1px solid #9565ff66;border-radius:12px;background:linear-gradient(110deg,#7046ce,#315dbb);color:white;text-align:left;font-weight:700}
.label{font-size:11px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}
.history{display:flex;flex-direction:column;gap:7px}
.history button{padding:9px;border:0;border-radius:9px;background:#ffffff08;color:#cbd3ec;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px}
.main{display:flex;flex-direction:column;overflow:hidden}
.top{height:65px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.topname{font-weight:800}.sub{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:8px}
.icon{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#ffffff09;color:white}
.messages{flex:1;overflow:auto;padding:25px max(15px,calc((100% - 820px)/2));scroll-behavior:smooth}
.welcome{text-align:center;max-width:650px;margin:8vh auto 25px}
.welogo{width:75px;height:75px;margin:auto auto 18px;border-radius:24px;background:linear-gradient(135deg,#a66cff,#438bff);display:grid;place-items:center;font-size:34px;box-shadow:0 12px 40px #7658e855}
h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin:0 0 12px}
.grad{background:linear-gradient(90deg,#c6a8ff,#8bc5ff);background-clip:text;color:transparent}
.welcome p{color:var(--muted)}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.suggest{padding:13px;border:1px solid var(--line);background:#ffffff08;color:#e8ebff;border-radius:13px;text-align:left}
.msg{display:flex;gap:10px;margin:18px auto;max-width:820px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.avatar{width:33px;height:33px;flex:0 0 33px;border-radius:11px;background:linear-gradient(135deg,#7652cf,#3876cf);display:grid;place-items:center;font-size:12px}
.bubble{max-width:85%;padding:12px 15px;border:1px solid var(--line);border-radius:5px 16px 16px 16px;background:#ffffff09;white-space:pre-wrap;overflow-wrap:anywhere}
.user .bubble{background:linear-gradient(135deg,#38286b,#253c70);border-radius:16px 5px 16px 16px}
.bubble img{display:block;max-width:100%;max-height:280px;border-radius:10px;margin-top:8px}
.tools{display:flex;gap:8px;margin-top:7px}
.tiny{background:none;border:0;color:#aeb8d2;font-size:12px}
.composerwrap{padding:12px 16px 16px;border-top:1px solid var(--line);background:#0d1020}
.preview{max-width:820px;margin:0 auto 8px;display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:6px 9px;border-radius:9px;background:#252c46;border:1px solid var(--line);font-size:12px}
.chip button{border:0;background:none;color:#ffb4b4}
.composer{max-width:820px;margin:auto;border:1px solid #8b78c655;border-radius:17px;background:#171d33;padding:8px;display:flex;align-items:flex-end;gap:7px}
textarea{flex:1;resize:none;max-height:150px;min-height:42px;border:0;outline:0;background:none;color:white;padding:10px}
textarea::placeholder{color:#818ba8}
.tool{width:39px;height:39px;flex:0 0 39px;border:1px solid var(--line);background:#ffffff09;color:white;border-radius:11px}
.send{background:linear-gradient(135deg,#9565f6,#438bff);border:0;font-weight:bold}
.hint{text-align:center;color:#717b98;font-size:10px;margin:7px auto 0;max-width:820px}
.hidden{display:none!important}
@media(max-width:760px){
.app{display:block;padding:0}.sidebar{display:none}.main{height:100dvh;border:0;border-radius:0}
.top{height:58px;padding:0 13px}.messages{padding:17px 12px}
.welcome{margin:8vh auto 20px}.suggestions{grid-template-columns:1fr}
.composerwrap{padding:9px 9px calc(9px + env(safe-area-inset-bottom))}
.composer{gap:5px;padding:6px}.tool{width:35px;height:35px;flex-basis:35px}
.bubble{max-width:88%}.sub{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">✦</div>KhangGPT <span class="tag">ULTRA</span></div>
 <button class="new" id="newChat">＋ Cuộc trò chuyện mới</button>
 <div class="label">Lịch sử trò chuyện</div>
 <div class="history" id="historyList"></div>
 <div class="sidebottom">✦ KhangGPT Ultra<br><br>Trợ lý AI của bạn</div>
</aside>

<main class="main">
 <header class="top">
  <div><div class="topname">KhangGPT <span class="grad">Ultra</span></div><div class="sub">Trợ lý AI thông minh</div></div>
  <div class="actions">
   <button class="icon" id="soundBtn" title="Bật/tắt đọc">🔊</button>
   <button class="icon" id="clearBtn" title="Cuộc trò chuyện mới">↻</button>
  </div>
 </header>

 <section class="messages" id="messages">
  <div class="welcome" id="welcome">
   <div class="welogo">✦</div>
   <h1>Chào mừng đến với<br><span class="grad">KhangGPT Ultra</span></h1>
   <p>Hỏi bất cứ điều gì, gửi ảnh hoặc tài liệu PDF để bắt đầu.</p>
   <div class="suggestions">
    <button class="suggest" data-prompt="Hãy giải thích một kiến thức khó theo cách dễ hiểu.">✧ Giải thích kiến thức</button>
    <button class="suggest" data-prompt="Hãy phân tích hình ảnh mình gửi.">▧ Phân tích ảnh</button>
    <button class="suggest" data-prompt="Hãy tóm tắt tài liệu mình gửi.">▤ Tóm tắt tài liệu</button>
    <button class="suggest" data-prompt="Gợi ý một ý tưởng website thú vị.">⌘ Ý tưởng sáng tạo</button>
   </div>
  </div>
 </section>

 <div class="composerwrap">
  <div class="preview" id="preview"></div>
  <div class="composer">
   <button class="tool" id="attachBtn" title="Chọn ảnh hoặc PDF">＋</button>
   <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,application/pdf,.pdf" multiple hidden>
   <textarea id="prompt" rows="1" placeholder="Nhắn tin cho KhangGPT Ultra..."></textarea>
   <button class="tool" id="micBtn" title="Nhập giọng nói">🎙</button>
   <button class="tool send" id="sendBtn" title="Gửi">➤</button>
  </div>
  <div class="hint">Ảnh cần Worker hỗ trợ Vision. PDF được trích xuất chữ trên trình duyệt.</div>
 </div>
</main>
</div>

<script>
(() => {
"use strict";

const API_URL = "https://khanggpt.itzkenmcxd.workers.dev";
const $ = id => document.getElementById(id);
const messagesEl = $("messages");
const promptEl = $("prompt");
const fileInput = $("fileInput");
const preview = $("preview");
const historyList = $("historyList");

let files = [];
let messages = [];
let chats = [];
let busy = false;
let speechOn = true;

if (window.pdfjsLib) {
 pdfjsLib.GlobalWorkerOptions.workerSrc =
 "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function scrollBottom() {
 messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showMessage(role, text, imageUrls = []) {
 $("welcome").classList.add("hidden");
 const row = document.createElement("div");
 row.className = "msg " + role;

 const avatar = document.createElement("div");
 avatar.className = "avatar";
 avatar.textContent = role === "user" ? "Bạn" : "✦";

 const bubble = document.createElement("div");
 bubble.className = "bubble";
 bubble.textContent = text || "";

 imageUrls.forEach(url => {
  const img = document.createElement("img");
  img.src = url;
  img.alt = "Ảnh đã gửi";
  bubble.appendChild(img);
 });

 row.append(avatar, bubble);

 if (role === "assistant") {
  const tools = document.createElement("div");
  tools.className = "tools";

  const copy = document.createElement("button");
  copy.className = "tiny";
  copy.textContent = "Sao chép";
  copy.onclick = () => {
   if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).catch(() => alert("Không thể sao chép."));
   } else {
    alert("Trình duyệt không hỗ trợ sao chép.");
   }
  };

  const speak = document.createElement("button");
  speak.className = "tiny";
  speak.textContent = "Đọc";
  speak.onclick = () => speakText(text);

  tools.append(copy, speak);
  bubble.appendChild(tools);
 }

 messagesEl.appendChild(row);
 scrollBottom();
 return bubble;
}

function speakText(text) {
 if (!("speechSynthesis" in window)) {
  alert("Trình duyệt chưa hỗ trợ đọc văn bản.");
  return;
 }
 speechSynthesis.cancel();
 const utterance = new SpeechSynthesisUtterance(text);
 utterance.lang = "vi-VN";
 speechSynthesis.speak(utterance);
}

function updatePreview() {
 preview.innerHTML = "";
 files.forEach((file, index) => {
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.textContent = (file.type === "application/pdf" ? "📄 " : "🖼 ") + file.name.slice(0,25);

  const remove = document.createElement("button");
  remove.textContent = " ×";
  remove.onclick = () => {
   files.splice(index, 1);
   updatePreview();
  };
  chip.appendChild(remove);
  preview.appendChild(chip);
 });
}

function readDataURL(file) {
 return new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.onerror = () => reject(new Error("Không đọc được file ảnh."));
  reader.readAsDataURL(file);
 });
}

async function extractPDF(file) {
 if (!window.pdfjsLib) {
  throw new Error("Không tải được PDF.js. Hãy kiểm tra kết nối Internet.");
 }

 if (file.size > 12 * 1024 * 1024) {
  throw new Error("PDF quá lớn. Giới hạn là 12 MB.");
 }

 const data = new Uint8Array(await file.arrayBuffer());
 const pdf = await pdfjsLib.getDocument({data}).promise;

 let result = "";
 const maxPages = Math.min(pdf.numPages, 25);

 for (let pageNo = 1; pageNo <= maxPages; pageNo++) {
  const page = await pdf.getPage(pageNo);
  const content = await page.getTextContent();
  const text = content.items.map(item => item.str).join(" ");

  result += "\n[Trang " + pageNo + "]\n" + text + "\n";

  if (result.length >= 35000) break;
 }

 if (!result.trim() || result.replace(/\[Trang \d+\]/g, "").trim().length < 10) {
  throw new Error("PDF không có văn bản đọc được. Có thể đây là PDF scan chứa ảnh.");
 }

 return result.slice(0,35000) +
  (pdf.numPages > maxPages ? "\nĐã giới hạn ở 25 trang đầu." : "");
}

function renderHistory() {
 historyList.innerHTML = "";
 chats.slice(-8).reverse().forEach(chat => {
  const button = document.createElement("button");
  button.textContent = "▸ " + chat.title;
  button.onclick = () => {
   messages = chat.messages.map(m => ({...m}));
   messagesEl.innerHTML = "";
   $("welcome").classList.add("hidden");
   messages.forEach(m => showMessage(m.role, typeof m.content === "string" ? m.content : "[Tin nhắn có tệp đính kèm]"));
  };
  historyList.appendChild(button);
 });
}

function saveCurrentChat() {
 if (!messages.length) return;
 const first = messages.find(m => m.role === "user");
 const title = first
  ? (typeof first.content === "string" ? first.content : "Cuộc trò chuyện có tệp").slice(0,35)
  : "Cuộc trò chuyện mới";

 chats.push({title, messages:messages.map(m => ({...m}))});
 chats = chats.slice(-8);
 renderHistory();
}

function newChat() {
 if (messages.length) saveCurrentChat();
 messages = [];
 files = [];
 updatePreview();
 messagesEl.innerHTML = "";
 messagesEl.appendChild($("welcome"));
 $("welcome").classList.remove("hidden");
 promptEl.value = "";
 if ("speechSynthesis" in window) speechSynthesis.cancel();
}

async function sendMessage() {
 if (busy) return;

 const question = promptEl.value.trim();
 if (!question && !files.length) return;

 busy = true;
 $("sendBtn").disabled = true;

 const selectedFiles = [...files];
 files = [];
 updatePreview();
 promptEl.value = "";
 promptEl.style.height = "auto";

 let content = [];
 let displayImages = [];

 try {
  if (question) content.push({type:"text", text:question});

  for (const file of selectedFiles) {
   if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
    const pdfText = await extractPDF(file);
    content.push({
     type:"text",
     text:"Nội dung trích xuất từ PDF " + file.name +
      ":\n" + pdfText + "\nHãy đọc và trả lời dựa trên tài liệu."
    });
   } else if (["image/jpeg","image/png","image/webp"].includes(file.type)) {
    if (file.size > 5 * 1024 * 1024) {
     throw new Error("Ảnh " + file.name + " lớn hơn 5 MB.");
    }
    const dataUrl = await readDataURL(file);
    displayImages.push(dataUrl);
    content.push({
     type:"image_url",
     image_url:{url:dataUrl}
    });
   } else {
    throw new Error("Định dạng file không được hỗ trợ: " + file.name);
   }
  }

  if (!content.length) throw new Error("Không có nội dung để gửi.");

  const shownText = question ||
   "Đã gửi tệp: " + selectedFiles.map(f => f.name).join(", ");

  showMessage("user", shownText, displayImages);

  const userContent = content.length === 1 && content[0].type === "text"
   ? content[0].text : content;

  messages.push({role:"user", content:userContent});

  const typing = showMessage("assistant", "KhangGPT Ultra đang suy nghĩ...");

  const response = await fetch(API_URL, {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages:messages.slice(-12)})
  });

  let data;
  try {
   data = await response.json();
  } catch {
   throw new Error("Worker không trả về JSON hợp lệ.");
  }

  if (!response.ok) {
   throw new Error(data.details || data.error || "Worker báo lỗi HTTP " + response.status);
  }

  const answer = data.reply || data.response ||
   data.choices?.[0]?.message?.content;

  if (typeof answer !== "string" || !answer.trim()) {
   throw new Error("AI chưa trả về câu trả lời.");
  }

  typing.textContent = answer;
  messages.push({role:"assistant", content:answer});

  if (speechOn) speakText(answer);
  renderHistory();

 } catch (error) {
  showMessage("assistant",
   "⚠️ " + (error.message || "Đã xảy ra lỗi.") +
   "\n\nNếu gửi ảnh bị lỗi, Worker có thể chưa hỗ trợ định dạng Vision mà website gửi. PDF dạng văn bản được xử lý riêng trên trình duyệt.");
 } finally {
  busy = false;
  $("sendBtn").disabled = false;
  promptEl.focus();
 }
}

$("attachBtn").onclick = () => fileInput.click();

fileInput.onchange = () => {
 const incoming = Array.from(fileInput.files || []);
 if (files.length + incoming.length > 5) {
  alert("Chỉ chọn tối đa 5 file mỗi lượt.");
 } else {
  files.push(...incoming);
  updatePreview();
 }
 fileInput.value = "";
};

$("sendBtn").onclick = sendMessage;

promptEl.addEventListener("keydown", event => {
 if (event.key === "Enter" && !event.shiftKey) {
  event.preventDefault();
  sendMessage();
 }
});

promptEl.addEventListener("input", () => {
 promptEl.style.height = "auto";
 promptEl.style.height = Math.min(promptEl.scrollHeight, 150) + "px";
});

$("newChat").onclick = newChat;
$("clearBtn").onclick = newChat;

$("soundBtn").onclick = () => {
 speechOn = !speechOn;
 $("soundBtn").textContent = speechOn ? "🔊" : "🔇";
 if (!speechOn && "speechSynthesis" in window) speechSynthesis.cancel();
};

$("micBtn").onclick = () => {
 const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
 if (!Recognition) {
  alert("Trình duyệt chưa hỗ trợ nhập giọng nói. Hãy thử Chrome.");
  return;
 }

 const recognition = new Recognition();
 recognition.lang = "vi-VN";
 recognition.interimResults = false;
 recognition.onresult = event => {
  promptEl.value += (promptEl.value ? " " : "") +
   event.results[0][0].transcript;
 };
 recognition.onerror = () => alert("Không nhận được giọng nói. Hãy kiểm tra quyền micro.");
 recognition.start();
};

document.querySelectorAll(".suggest").forEach(button => {
 button.onclick = () => {
  promptEl.value = button.dataset.prompt;
  sendMessage();
 };
});

})();
</script>
</body>
</html>
